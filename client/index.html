<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gemini Travel AI Chatbot</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="chat-header">
      <div class="header-title">
        <span class="icon">✈️</span>
        <div>
          <h1>Travel AI Assistant</h1>
          <span class="status-indicator"><span class="dot"></span> Online</span>
        </div>
      </div>
      <button id="clear-btn" class="clear-btn" title="Reset Percakapan">Reset Chat</button>
    </header>
    
    <div id="chat-box" class="chat-box"></div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Tanyakan seputar tempat wisata, itinerary, atau tips liburan..." autocomplete="off" required />
      <button type="submit" id="send-btn">
        <span>Kirim</span>
        <svg class="send-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
